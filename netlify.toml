# Netlify: connect this repository (Site settings → Build & deploy → Link repository).
# No build step: the site is the static `web/` folder, refreshed by the GitHub Action.
# netlify/functions/api.mjs is a small bundled function (served at /api/count and /api/feedback)
# that keeps the front page's visit / "it helped" counters and the anonymous comments in Netlify
# Blobs. It is pre-bundled and committed, so the deploy installs nothing.
[build]
  publish = "web"
  command = ""

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=300"

# The former short explainer now lives on the methodology page.
[[redirects]]
  from = "/how.html"
  to = "/methodology.html"
  status = 301
