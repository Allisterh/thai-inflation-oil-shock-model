name: Daily data sync and model refresh

# Refreshes data/cache, results/ and web/data/latest.json and commits them back to the branch
# the workflow runs on. Netlify (or any host linked to this repository) then redeploys
# automatically. Publish directory: `web`.

on:
  schedule:
    # 23:30 UTC = 06:30 Bangkok, after the previous day's ICE/EIA settlement and the EPPO price update.
    - cron: "30 23 * * 1-5"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["thai_oil_cpi/**", "requirements.txt", ".github/workflows/daily-sync.yml"]

permissions:
  contents: write

concurrency:
  group: daily-sync
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Sync data and re-estimate
        run: python -m thai_oil_cpi run --force
      - name: Run tests
        run: python -m pytest -q
      - name: Commit refreshed data and results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/cache results web/data
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "chore: daily data sync $(date -u +%Y-%m-%d)"
            git pull --rebase origin "${{ github.ref_name }}"
            git push origin "HEAD:${{ github.ref_name }}"
          fi
