name: Daily data sync and model refresh

on:
  schedule:
    # 23:30 UTC = 06:30 Bangkok, after the previous day's ICE Brent settlement.
    - cron: "30 23 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Sync data and re-estimate
        env:
          THAI_CPI_URL: ${{ secrets.THAI_CPI_URL }}
        run: python -m thai_oil_cpi run --force
      - name: Commit refreshed data and results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/cache results web/data
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "chore: daily data sync $(date -u +%Y-%m-%d)"
            git push
          fi
      - name: Upload web app as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy-pages:
    needs: refresh
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
